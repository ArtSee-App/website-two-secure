[build]
  functions = "netlify/functions"
  publish = "dist"

[dev]
  command   = "npm run serve"
  port      = 8888
  functions = "netlify/functions"

# Hashed build output: cache forever (index.html, favicon, logo.webp and blog-posts stay on the default)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
